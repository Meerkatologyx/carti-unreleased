name: Deploy to GitHub Pages

# Rebuilds the site from the latest Carti tracker sheet on every push, every
# 6 hours, and on demand (Actions tab -> Run workflow).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          YOUTUBE_DL_SKIP_PYTHON_CHECK: '1'
          YOUTUBE_DL_SKIP_DOWNLOAD: 'true'
      - name: Pull the latest Carti tracker data
        run: node scripts/build-carti-data.mjs
      # Genius lookups are kept between runs (on top of the committed copy), so a
      # build only asks about songs it hasn't seen. A blocked or slow Genius never
      # fails the deploy: the last lyrics.json is kept.
      - name: Restore the Genius lyrics cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/genius-cache.json
          key: genius-${{ github.run_id }}
          restore-keys: genius-
      - name: Lyrics from Genius
        run: node scripts/genius-lyrics.mjs --max 300
        continue-on-error: true
        timeout-minutes: 15
      - name: Save the Genius lyrics cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/genius-cache.json
          key: genius-${{ github.run_id }}
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
